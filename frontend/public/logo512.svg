<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bookGradient512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00bcd4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b61ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bookGradient512)" opacity="0.1"/>
  <!-- Book Cover -->
  <rect x="96" y="64" width="320" height="384" rx="20" fill="url(#bookGradient512)" stroke="#ffffff" stroke-width="4" filter="url(#glow512)"/>
  <!-- Book Pages -->
  <rect x="128" y="96" width="256" height="320" rx="12" fill="#ffffff" opacity="0.95"/>
  <!-- Book Lines -->
  <line x1="160" y1="160" x2="352" y2="160" stroke="#00bcd4" stroke-width="6" opacity="0.7"/>
  <line x1="160" y1="200" x2="352" y2="200" stroke="#00bcd4" stroke-width="6" opacity="0.7"/>
  <line x1="160" y1="240" x2="352" y2="240" stroke="#00bcd4" stroke-width="6" opacity="0.7"/>
  <line x1="160" y1="280" x2="352" y2="280" stroke="#00bcd4" stroke-width="6" opacity="0.7"/>
  <line x1="160" y1="320" x2="352" y2="320" stroke="#00bcd4" stroke-width="6" opacity="0.7"/>
  <line x1="160" y1="360" x2="352" y2="360" stroke="#00bcd4" stroke-width="6" opacity="0.7"/>
  <!-- Book Spine -->
  <rect x="96" y="64" width="48" height="384" rx="12" fill="#7b61ff" opacity="0.9"/>
  <!-- Title on spine -->
  <text x="120" y="280" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="bold" transform="rotate(-90 120 280)">BOOK LIBRARY</text>
  <!-- Book icon on cover -->
  <circle cx="256" cy="200" r="40" fill="rgba(255,255,255,0.2)"/>
  <text x="256" y="215" fill="#7b61ff" font-family="Arial, sans-serif" font-size="32" text-anchor="middle" font-weight="bold">📚</text>
</svg>