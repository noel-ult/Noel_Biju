<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" fill="none">
  <defs>
    <linearGradient id="bookGradient192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00bcd4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b61ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="96" cy="96" r="90" fill="url(#bookGradient192)" opacity="0.1"/>
  <!-- Book Cover -->
  <rect x="36" y="24" width="120" height="144" rx="8" fill="url(#bookGradient192)" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
  <!-- Book Pages -->
  <rect x="48" y="36" width="96" height="120" rx="4" fill="#ffffff" opacity="0.95"/>
  <!-- Book Lines -->
  <line x1="60" y1="60" x2="132" y2="60" stroke="#00bcd4" stroke-width="3" opacity="0.7"/>
  <line x1="60" y1="78" x2="132" y2="78" stroke="#00bcd4" stroke-width="3" opacity="0.7"/>
  <line x1="60" y1="96" x2="132" y2="96" stroke="#00bcd4" stroke-width="3" opacity="0.7"/>
  <line x1="60" y1="114" x2="132" y2="114" stroke="#00bcd4" stroke-width="3" opacity="0.7"/>
  <line x1="60" y1="132" x2="132" y2="132" stroke="#00bcd4" stroke-width="3" opacity="0.7"/>
  <!-- Book Spine -->
  <rect x="36" y="24" width="18" height="144" rx="4" fill="#7b61ff" opacity="0.9"/>
  <!-- Title on spine -->
  <text x="45" y="105" fill="#ffffff" font-family="Arial, sans-serif" font-size="8" font-weight="bold" transform="rotate(-90 45 105)">LIBRARY</text>
</svg>