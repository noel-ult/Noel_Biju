<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00bcd4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b61ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Book Cover -->
  <rect x="6" y="4" width="20" height="24" rx="2" fill="url(#bookGradient)" stroke="#ffffff" stroke-width="0.5"/>
  <!-- Book Pages -->
  <rect x="8" y="6" width="16" height="20" rx="1" fill="#ffffff" opacity="0.9"/>
  <!-- Book Lines -->
  <line x1="10" y1="10" x2="22" y2="10" stroke="#00bcd4" stroke-width="0.8" opacity="0.7"/>
  <line x1="10" y1="13" x2="22" y2="13" stroke="#00bcd4" stroke-width="0.8" opacity="0.7"/>
  <line x1="10" y1="16" x2="22" y2="16" stroke="#00bcd4" stroke-width="0.8" opacity="0.7"/>
  <line x1="10" y1="19" x2="22" y2="19" stroke="#00bcd4" stroke-width="0.8" opacity="0.7"/>
  <!-- Book Spine -->
  <rect x="6" y="4" width="3" height="24" rx="1" fill="#7b61ff" opacity="0.8"/>
</svg>